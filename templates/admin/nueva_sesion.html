{% extends "base.html" %}
{% block titulo %}Nueva sesión{% endblock %}
{% block contenido %}
<a class="volver" href="{{ url_for('panel') }}">← Panel</a>
<h1>Nueva sesión</h1>
<form method="post" class="formulario">
  <label>Fecha
    <input id="dia" name="dia" type="date" min="{{ hoy }}" required value="{{ form.get('dia', '') }}">
  </label>
  <label>Hora del pase
    <select id="hora" name="hora" required>
      {% for h in horas_pase %}
      <option value="{{ h }}" {% if form.get('hora') == h %}selected{% endif %}>{{ h }}</option>
      {% endfor %}
    </select>
    <small id="dia-completo" hidden>Ese día ya tiene creados todos los pases.</small>
  </label>
  <label>Plazas
    <input name="plazas" type="number" min="1" required value="{{ form.get('plazas', '') }}">
  </label>
  <button class="boton" type="submit">Crear</button>
</form>

<script>
  // Las horas que ya tienen pase el día elegido no se pueden volver a escoger
  (function () {
    var ocupadas = {{ ocupadas | tojson }};
    var dia = document.getElementById("dia");
    var hora = document.getElementById("hora");
    var opciones = Array.from(hora.options);
    function actualizar() {
      var usadas = ocupadas[dia.value] || [];
      opciones.forEach(function (o) {
        o.disabled = usadas.indexOf(o.value) !== -1;
        o.textContent = o.value + (o.disabled ? " (ya creado)" : "");
      });
      var libres = opciones.filter(function (o) { return !o.disabled; });
      if (!libres.length) hora.selectedIndex = -1;
      else if (hora.selectedIndex === -1 || hora.options[hora.selectedIndex].disabled) hora.value = libres[0].value;
      document.getElementById("dia-completo").hidden = libres.length > 0;
    }
    dia.addEventListener("input", actualizar);
    actualizar();
  })();
</script>
{% endblock %}
